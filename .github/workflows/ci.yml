name: Aluminum OS v3.0 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-build:
    name: Build & Test Rust Crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build workspace
        run: cargo build --workspace --exclude forge-boot --release
      - name: Run tests
        run: cargo test --workspace --exclude forge-boot --release

  python-validate:
    name: Validate Manus Core (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r manus-core/requirements.txt
      - name: Validate bridge
        run: cd manus-core && python bridge.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}

  integration:
    name: Integration Test
    needs: [rust-build, python-validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r manus-core/requirements.txt
      - name: Start API server
        run: |
          cd manus-core && python server.py &
          sleep 3
      - name: Health check
        run: curl -f http://localhost:8080/health
      - name: Test intent endpoint
        run: |
          curl -s -X POST http://localhost:8080/intent \
            -H "Content-Type: application/json" \
            -d '{"text": "Run the daily sync"}' | python -m json.tool
