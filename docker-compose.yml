version: '3.9'

# Aluminum OS v3.0 — Docker Compose
# This actually works. Unlike Grok's version.

services:
  # Ring 1: Manus Core API
  manus-core:
    build:
      context: ./manus-core
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_API_BASE=${OPENAI_API_BASE:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - XAI_API_KEY=${XAI_API_KEY:-}
      - DAILY_BUDGET=10.0
    volumes:
      - manus-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Ring 2: SHELDONBRAIN Memory (ChromaDB)
  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    volumes:
      - chroma-data:/chroma/chroma
    restart: unless-stopped

  # Dashboard
  dashboard:
    build:
      context: ./website
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - manus-core
    restart: unless-stopped

volumes:
  manus-data:
  chroma-data:
